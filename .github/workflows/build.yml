 name: Build APK
 on:
   push:
   workflow_dispatch:
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-java@v4
         with:
           distribution: temurin
           java-version: '17'
       - uses: gradle/actions/setup-gradle@v4
         with:
           gradle-version: '8.7'
       - name: Build
         run: |
           set +e
           gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
           code=$?
           grep -E "^e: |Could not|What went wrong|Execution failed|Duplicate class|error:" build.log | head -20 | sed 's/^/::error::/'
           exit $code
       - uses: actions/upload-artifact@v4
         with:
           name: capri-apk
           path: app/build/outputs/apk/debug/app-debug.apk
