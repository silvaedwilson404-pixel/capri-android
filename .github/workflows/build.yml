 name: Build APK
 on:
   push:
   workflow_dispatch:
 jobs:
   build:
     runs-on: ubuntu-latest
     steps:
       - uses: actions/checkout@v4
       - uses: actions/setup-java@v4
         with:
           distribution: temurin
           java-version: '17'
       - uses: gradle/actions/setup-gradle@v4
         with:
           gradle-version: '8.7'
       - name: Build
         run: |
           set +e
           gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
           code=$?
           {
             echo '## Erro do build'
             echo '```'
             grep -E "^e: |What went wrong|Could not|error:" -A 6 build.log | head -60
             echo '```'
           } >> "$GITHUB_STEP_SUMMARY"
           exit $code
       - uses: actions/upload-artifact@v4
         with:
           name: capri-apk
           path: app/build/outputs/apk/debug/app-debug.apk
